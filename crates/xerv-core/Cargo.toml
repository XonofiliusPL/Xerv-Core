[package]
name = "xerv-core"
version = "0.2.1"
edition = "2021"
rust-version = "1.74"
description = "Minimal Xerv foundation: errors, version, config, logging, state, lifecycle"
license = "MIT OR Apache-2.0"

[lib]
name = "xerv_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "5"
semver = "1"

[dev-dependencies]
tempfile = "3"
