[package]
name = "xerv-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Xerv TUI — first skeleton, consumer of xerv-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "xerv"
path = "src/main.rs"

[dependencies]
xerv-core = { path = "../xerv-core" }
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
semver = "1"
